<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b1d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="글방">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' photo: blob:; connect-src 'self' blob:">
<title>글방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfaf7; --panel: #f3f1ec; --ink: #222; --muted: #8a867e; --line: #e4e0d8;
    --accent: #b0503c; --hover: #ebe7df;
    --serif: "Noto Serif KR", "Source Serif Pro", Georgia, serif;
    --sans: "Noto Sans KR", -apple-system, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #1b1b1d; --panel: #232326; --ink: #e6e3dc; --muted: #8d8a84; --line: #333336;
    --accent: #e08a6f; --hover: #2c2c30;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; background: transparent; border: 0; outline: none; }

  .app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  /* 숨겨진 타이틀바: 상단 영역을 끌어서 창 이동 */
  .brand, .toolbar { -webkit-app-region: drag; user-select: none; }
  .brand *, .toolbar button, .toolbar input { -webkit-app-region: no-drag; }
  .brand { padding: 46px 20px 12px; font-family: var(--serif); font-weight: 700; letter-spacing: .08em; font-size: 15px; }
  .brand span { border-right: 2px solid var(--ink); padding-right: 3px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { border-color: transparent; } }
  .side-list { flex: 1; overflow-y: auto; padding: 4px 10px; }
  .folder-head { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 14px 10px 4px; text-transform: uppercase; letter-spacing: .06em; }
  .story-item { display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 6px; font-family: var(--serif); font-size: 14px; }
  .story-item small { display: block; font-family: var(--sans); font-size: 11px; color: var(--muted); margin-top: 2px; }
  .story-item:hover { background: var(--hover); }
  .story-item.active { background: var(--hover); color: var(--accent); }
  .side-foot { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-wrap: wrap; gap: 4px; }
  .side-foot button, .tool { font-size: 12px; color: var(--muted); padding: 6px 8px; border-radius: 5px; }
  .side-foot button:hover, .tool:hover { background: var(--hover); color: var(--ink); }

  main { overflow-y: auto; position: relative; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 56px 32px 120px; }
  .toolbar { position: sticky; top: 0; z-index: 2; display: flex; gap: 4px; justify-content: flex-end; padding: 12px 16px; min-height: 52px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); }
  .toolbar .spacer { flex: 1; }

  .story-head { text-align: center; margin-bottom: 40px; }
  .story-head h1 { font-family: var(--serif); font-size: 28px; font-weight: 700; margin: 0 0 10px; }
  .story-head p { color: var(--muted); font-family: var(--serif); font-size: 14px; margin: 0; white-space: pre-line; }
  .story-head .meta { font-size: 11px; margin-top: 14px; letter-spacing: .04em; }
  .new-post { display: block; width: 100%; border: 1px dashed var(--line); border-radius: 8px; padding: 14px; color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .new-post:hover { color: var(--accent); border-color: var(--accent); }

  .post-card { display: block; width: 100%; text-align: left; padding: 20px 4px; border-bottom: 1px solid var(--line); }
  .post-card:hover h3 { color: var(--accent); }
  .post-card time { font-size: 11px; color: var(--muted); letter-spacing: .05em; }
  .post-card h3 { font-family: var(--serif); font-size: 18px; margin: 6px 0 8px; font-weight: 700; }
  .post-card p { font-family: var(--serif); font-size: 14px; color: var(--muted); margin: 0; line-height: 1.7;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 60px 0; line-height: 1.8; white-space: pre-line; }
  .post-card.has-thumb { display: grid; grid-template-columns: 1fr 84px; gap: 18px; align-items: center; }
  .post-card .thumb { width: 84px; height: 84px; object-fit: cover; border-radius: 6px; background: var(--panel); }

  /* 사진 */
  .gallery { margin: 0 0 36px; }
  .gallery img { display: block; width: 100%; border-radius: 6px; cursor: zoom-in; background: var(--panel); }
  .gallery .rest { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
  .gallery .rest img { aspect-ratio: 1; object-fit: cover; }
  .photo-strip { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
  .photo-strip .ph { position: relative; width: 84px; height: 84px; }
  .photo-strip .ph img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; cursor: pointer; }
  .photo-strip .ph.cover img { outline: 2px solid var(--accent); outline-offset: 2px; }
  .photo-strip .ph .x { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 20px; }
  .photo-strip .add { width: 84px; height: 84px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); font-size: 12px; }
  .photo-strip .add:hover { color: var(--accent); border-color: var(--accent); }
  .editor.dragover { outline: 2px dashed var(--accent); outline-offset: 8px; border-radius: 8px; }
  .lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  .lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 4px; }
  .sync-line { width: 100%; font-size: 11px; color: var(--muted); padding: 2px 8px 4px; }

  .reader time { display: block; text-align: center; font-size: 12px; color: var(--muted); letter-spacing: .05em; }
  .reader h2 { font-family: var(--serif); font-size: 26px; text-align: center; margin: 12px 0 40px; }
  .reader .body { font-family: var(--serif); font-size: var(--fs, 17px); line-height: 2; white-space: pre-wrap; word-break: keep-all; }
  .reader .body.center { text-align: center; } .reader .body.justify { text-align: justify; }
  .hint { text-align: center; color: var(--muted); font-size: 11px; margin-top: 60px; }

  .editor input.title { width: 100%; font-family: var(--serif); font-size: 26px; font-weight: 700; text-align: center; margin: 12px 0 30px; }
  .editor input.date { display: block; margin: 0 auto; text-align: center; font-size: 12px; color: var(--muted); }
  .editor textarea { width: 100%; min-height: 60vh; resize: none; font-family: var(--serif); font-size: var(--fs, 17px); line-height: 2; word-break: keep-all; }
  .counter { position: fixed; bottom: 18px; right: 24px; font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 5px 10px; border-radius: 20px; }
  .saved { position: fixed; bottom: 18px; left: 284px; font-size: 11px; color: var(--muted); }

  .search { width: 100%; border-bottom: 1px solid var(--line); padding: 10px 2px; font-size: 16px; font-family: var(--serif); margin-bottom: 20px; }
  mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; }

  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); padding: 24px; width: min(420px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h4 { margin: 0 0 4px; font-family: var(--serif); }
  dialog .desc { color: var(--muted); font-size: 12px; margin: 0 0 16px; white-space: pre-line; }
  dialog input, dialog select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; margin-bottom: 10px; background: var(--panel); }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  dialog .row button { padding: 7px 14px; border-radius: 6px; }
  dialog .primary { background: var(--accent); color: #fff; }

  /* ---------- 홈 화면 ---------- */
  .brand .home-link { font: inherit; letter-spacing: inherit; padding: 0; }
  .home-title { text-align: center; font-family: var(--serif); font-weight: 700; font-size: 30px; letter-spacing: .12em; margin: 0 0 36px; }
  .home-sec { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 10px; }
  .home-sec h2 { margin: 0; font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .08em; }
  .dday-row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 12px; margin: 0 -2px 30px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .dday-row::-webkit-scrollbar { display: none; }
  .dday { flex: 0 0 auto; min-width: 128px; max-width: 180px; scroll-snap-align: start; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); display: flex; flex-direction: column; gap: 3px; }
  .dday:hover { border-color: var(--accent); }
  .dday .num { font-family: var(--serif); font-weight: 700; font-size: 24px; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .dday.past .num { color: var(--muted); }
  .dday .name { font-family: var(--serif); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dday small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dday.today { background: var(--accent); border-color: var(--accent); }
  .dday.today .num, .dday.today .name, .dday.today small { color: #fff; }
  .dday.add { justify-content: center; align-items: center; color: var(--muted); border-style: dashed; background: none; font-size: 13px; min-width: 104px; }
  .dday.add:hover { color: var(--accent); }
  .home-folder { font-size: 11px; color: var(--muted); letter-spacing: .06em; margin: 26px 0 10px; padding-top: 4px; }
  .story-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .story-card { text-align: left; width: 100%; min-width: 0; padding: 20px 20px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 6px; }
  .story-card:hover { border-color: var(--accent); }
  .story-card:hover h3 { color: var(--accent); }
  .story-card h3 { font-family: var(--serif); font-size: 20px; font-weight: 700; margin: 0; word-break: keep-all; }
  .story-card .meta { font-size: 11px; color: var(--muted); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
  .story-card p { font-family: var(--serif); font-size: 14px; color: var(--muted); margin: 6px 0 0; line-height: 1.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .story-card.empty-folder { color: var(--muted); font-size: 13px; border-style: dashed; padding: 16px 20px; }
  .home-foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); }
  dialog label.field { display: block; font-size: 12px; color: var(--muted); margin: 2px 0 4px; }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .home-title { margin-bottom: 28px; }
    .story-cards { grid-template-columns: 1fr; }
    aside { display: none; } .app.side-open aside { display: flex; position: fixed; inset: 0 22% 0 0; z-index: 10; box-shadow: 0 0 40px rgba(0,0,0,.25); }
    .app.side-open main::after { content: ''; position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.25); }
    .wrap { padding: 32px 16px 100px; } .saved { left: 16px; }
    /* 아이폰은 16px보다 작은 입력칸에 초점이 가면 화면을 확대해 버림 */
    input, select, textarea, .editor input.date { font-size: max(16px, 1em); }
  }

  /* 웹앱(브라우저·홈 화면)일 때: 맥 신호등 자리 대신 아이폰 안전 영역 */
  .web-only { display: none; }
  .web .web-only { display: inline-block; }
  .web body { touch-action: manipulation; }
  .web .brand { padding-top: max(22px, env(safe-area-inset-top)); }
  .web .toolbar { padding-top: max(12px, env(safe-area-inset-top)); }
  .web .side-foot { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .web .counter { bottom: calc(18px + env(safe-area-inset-bottom)); }
  .web .saved { bottom: calc(18px + env(safe-area-inset-bottom)); }
  @media print {
    aside, .toolbar, .counter, .saved, .hint { display: none !important; } .app { display: block; }
    .gallery img { break-inside: avoid; max-height: 60vh; object-fit: contain; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand"><button class="home-link" id="goHome" title="홈으로"><span>글방</span></button></div>
    <div class="side-list" id="sideList"></div>
    <div class="side-foot">
      <div class="sync-line" id="syncLine"></div>
      <button id="btnAddStory">＋ 이야기</button>
      <button id="btnAddFolder">＋ 폴더</button>
      <button id="btnTrash">휴지통</button>
      <button id="btnSettings">설정</button>
      <button id="btnBackup">백업 내보내기</button>
      <button id="btnRestore">백업 불러오기</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="saved" id="saved"></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script src="web-bridge.js"></script>
<script>
// ---------- 저장소 (메인 프로세스의 SQLite에 저장) ----------
const DAY = 86400000;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const store = {
  data: null,
  timer: null,
  async load() {
    this.data = await window.geulbang.load();
    if (!this.data) { this.data = seed(); await window.geulbang.save(this.data); }
    this.data.settings = { ...seed().settings, ...this.data.settings };
    this.purgeTrash();
  },
  // 연속 입력은 묶어서 한 번에 기록
  save() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 150);
  },
  async flush() {
    clearTimeout(this.timer);
    try { await window.geulbang.save(this.data); flashSaved(); }
    catch (err) { $('#saved').textContent = '저장 실패: ' + err.message; }
  },
  // 휴지통 보관 30일 경과분 영구 삭제
  purgeTrash() {
    const cutoff = Date.now() - 30 * DAY;
    this.data.posts = this.data.posts.filter(p => !p.trashedAt || p.trashedAt > cutoff);
    this.data.stories = this.data.stories.filter(s => !s.trashedAt || s.trashedAt > cutoff);
  },
};

function seed() {
  // 고정 ID: 여러 기기에서 처음 실행해도 동기화 후 예시가 하나로 합쳐짐
  const storyId = 'welcome-story', now = Date.now();
  return {
    folders: [],
    stories: [{ id: storyId, folderId: null, title: '나의 첫 이야기', subtitle: '매일 한 줄이라도 써 보기', createdAt: now,
      trashedAt: null, orderBy: 'writedAt', orderDir: 'desc', rank: 0, dateVisible: true }],
    posts: [{ id: 'welcome-post', storyId, title: '시작', text: '여기에 첫 글이 있습니다.\n\n이야기 목록(☰)에서 이야기를 고르고, "새 글 쓰기"를 눌러 글을 써 보세요.\n글을 두 번 누르면 수정할 수 있어요.',
      writedAt: now, editedAt: now, trashedAt: null, align: 'left', photos: [] }],
    // D-day는 설정 안에 둔다: Mac(SQLite)·웹·백업 모두 설정을 통째로 저장하므로 따로 손대지 않아도 함께 보관된다
    settings: { theme: 'light', fontSize: 17, countMode: 0, ddays: [] },
  };
}

// ---------- 상태 ----------
const state = { view: 'home', storyId: null, postId: null, query: '' };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = t => { const d = new Date(t); return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}. ${'일월화수목금토'[d.getDay()]}요일`; };
const toLocalInput = t => { const d = new Date(t - new Date(t).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };

const liveStories = () => store.data.stories.filter(s => !s.trashedAt).sort((a, b) => a.rank - b.rank);
const story = id => store.data.stories.find(s => s.id === id);
const post = id => store.data.posts.find(p => p.id === id);
function postsOf(s) {
  const list = store.data.posts.filter(p => p.storyId === s.id && !p.trashedAt);
  const dir = s.orderDir === 'asc' ? 1 : -1;
  return list.sort((a, b) => s.orderBy === 'title' ? dir * a.title.localeCompare(b.title, 'ko') : dir * (a.writedAt - b.writedAt));
}

// ---------- 사이드바 ----------
function renderSide() {
  const stories = liveStories();
  const item = s => `<button class="story-item ${s.id === state.storyId && !['trash', 'search', 'home'].includes(state.view) ? 'active' : ''}" data-story="${s.id}">
      ${esc(s.title)}<small>글 ${postsOf(s).length}개</small></button>`;
  let html = stories.filter(s => !s.folderId).map(item).join('');
  for (const f of [...store.data.folders].sort((a, b) => a.rank - b.rank)) {
    html += `<div class="folder-head"><span>${esc(f.title)}</span><button class="tool" data-delfolder="${f.id}" title="폴더 삭제">×</button></div>`;
    html += stories.filter(s => s.folderId === f.id).map(item).join('') || `<div class="story-item"><small>비어 있음</small></div>`;
  }
  $('#sideList').innerHTML = html || `<div class="empty">이야기가 없어요.\n아래에서 추가해 보세요.</div>`;
}

// ---------- 메인 뷰 ----------
function render() {
  renderSide();
  const m = $('#main');
  const s = story(state.storyId);
  const fs = store.data.settings.fontSize;
  m.style.setProperty('--fs', fs + 'px');

  rememberDepth();
  if (state.view === 'trash') return renderTrash(m);
  if (state.view === 'search') return renderSearch(m);
  if (state.view === 'home' || !s) { state.view = 'home'; return renderHome(m); }

  if (state.view === 'story') {
    const posts = postsOf(s);
    m.innerHTML = `
      <div class="toolbar">
        <button class="tool" id="homeBtn">← 홈</button>
        <button class="tool" id="menuBtn">☰</button><span class="spacer"></span>
        <button class="tool" id="tSearch">검색</button>
        <button class="tool" id="tSort">${s.orderBy === 'title' ? '제목순' : '날짜순'} ${s.orderDir === 'asc' ? '↑' : '↓'}</button>
        <button class="tool" id="tStoryEdit">이야기 설정</button>
        <button class="tool" id="tExport">내보내기</button>
      </div>
      <div class="wrap">
        <div class="story-head"><h1>${esc(s.title)}</h1><p>${esc(s.subtitle)}</p>
          <div class="meta">${fmtDate(s.createdAt)} 시작 · 글 ${posts.length}개</div></div>
        <button class="new-post" id="newPost">＋ 새 글 쓰기</button>
        ${posts.map(p => `<button class="post-card ${photosOf(p).length ? 'has-thumb' : ''}" data-post="${p.id}"><div>
          ${s.dateVisible ? `<time>${fmtDate(p.writedAt)}</time>` : ''}
          <h3>${esc(p.title || '제목 없음')}</h3><p>${esc(p.text.slice(0, 200))}</p></div>
          ${photosOf(p).length ? `<img class="thumb" src="${photoUrl(photosOf(p)[0])}" alt="" loading="lazy">` : ''}</button>`).join('')
          || `<div class="empty">아직 글이 없어요.\n첫 글을 써 보세요.</div>`}
      </div>`;
    return;
  }

  const p = post(state.postId);
  if (!p) { state.view = 'story'; return render(); }

  if (state.view === 'read') {
    m.innerHTML = `
      <div class="toolbar">
        <button class="tool" id="back">← ${esc(s.title)}</button><span class="spacer"></span>
        <button class="tool" id="tEdit">수정</button>
        <button class="tool" id="tPrint">PDF</button>
        <button class="tool" id="tDelete">삭제</button>
      </div>
      <div class="wrap reader" id="reader">
        ${s.dateVisible ? `<time>${fmtDate(p.writedAt)}</time>` : ''}
        <h2>${esc(p.title || '제목 없음')}</h2>
        ${photosOf(p).length ? `<div class="gallery">
          <img src="${photoUrl(photosOf(p)[0])}" data-zoom="${esc(photosOf(p)[0])}" alt="">
          ${photosOf(p).length > 1 ? `<div class="rest">${photosOf(p).slice(1).map(n => `<img src="${photoUrl(n)}" data-zoom="${esc(n)}" alt="" loading="lazy">`).join('')}</div>` : ''}
        </div>` : ''}
        <div class="body ${p.align}">${esc(p.text)}</div>
        <div class="hint">글을 두 번 누르거나 위의 수정을 누르면 고칠 수 있어요</div>
      </div>
      <div class="counter" id="counter"></div>`;
    updateCounter(p.text);
    return;
  }

  if (state.view === 'edit') {
    m.innerHTML = `
      <div class="toolbar">
        <button class="tool" id="done">← 완료</button><span class="spacer"></span>
        <button class="tool" id="tAlign">정렬: ${{ left: '왼쪽', center: '가운데', justify: '양쪽' }[p.align]}</button>
      </div>
      <div class="wrap editor">
        <input class="date" type="datetime-local" id="eDate" value="${toLocalInput(p.writedAt)}">
        <input class="title" id="eTitle" placeholder="제목" value="${esc(p.title)}">
        <div class="photo-strip" id="photoStrip"></div>
        <textarea id="eText" placeholder="이곳에 글을 쓰세요" style="text-align:${p.align}">${esc(p.text)}</textarea>
      </div>
      <div class="counter" id="counter"></div>`;
    const ta = $('#eText');
    renderPhotoStrip(p);
    const ed = $('.editor');
    ed.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); ed.classList.add('dragover'); } });
    ed.addEventListener('dragleave', e => { if (!ed.contains(e.relatedTarget)) ed.classList.remove('dragover'); });
    ed.addEventListener('drop', async e => {
      if (!e.dataTransfer.files.length) return;
      e.preventDefault(); ed.classList.remove('dragover');
      addPhotos(p, await window.geulbang.importPhotos(e.dataTransfer.files));
    });
    const autosize = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
    autosize(); updateCounter(p.text);
    let timer;
    const autosave = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        p.title = $('#eTitle').value; p.text = ta.value; p.editedAt = Date.now();
        store.save();
      }, 400);
    };
    ta.addEventListener('input', () => { autosize(); updateCounter(ta.value); autosave(); });
    $('#eTitle').addEventListener('input', autosave);
    // 날짜는 직접 바꿨을 때만 반영 (입력칸은 분 단위라 매번 덮어쓰면 정렬이 어긋남)
    $('#eDate').addEventListener('change', () => {
      const d = new Date($('#eDate').value).getTime();
      if (!isNaN(d)) { p.writedAt = d; store.save(); }
    });
    if (!p.text) $('#eTitle').focus(); else ta.focus();
  }
}

// ---------- 홈 화면 ----------
const shortDate = t => { const d = new Date(t); return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`; };
// 이야기의 가장 최근 글 (이야기의 정렬 설정과 상관없이 쓴 날짜 기준)
const latestOf = s => store.data.posts.filter(p => p.storyId === s.id && !p.trashedAt).reduce((a, p) => (!a || p.writedAt > a.writedAt ? p : a), null);
const firstLine = p => (p.text.split('\n').map(l => l.trim()).find(Boolean) || p.title || '').slice(0, 120);

function renderHome(m) {
  const stories = liveStories();
  const card = s => {
    const n = postsOf(s).length, last = latestOf(s);
    return `<button class="story-card" data-story="${s.id}">

    list += `<div class="home-folder">${esc(f.title)}</div>

  }

    </div>

      <h1 class="home-title">글방</h1>

      </div>

}

// ---------- D-day ----------
const ddayList = () => (store.data.settings.ddays ??= []);
const dayIndex = d => Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
const parseDay = s => { const [y, mo, d] = s.split('-').map(Number); return new Date(y, mo - 1, d); };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// 매년 반복이면 오늘 이후(오늘 포함) 가장 가까운 그날. 2월 29일은 평년에 2월 28일로
function ddayTarget(x) {
  const base = parseDay(x.date);
  if (!x.yearly) return base;
  const now = new Date();
  const at = y => { const t = new Date(y, base.getMonth(), base.getDate()); if (t.getMonth() !== base.getMonth()) t.setDate(0); return t; };
  const t = at(now.getFullYear());
  return dayIndex(t) < dayIndex(now) ? at(now.getFullYear() + 1) : t;
}
function ddayInfo(x) {
  const t = ddayTarget(x), diff = dayIndex(t) - dayIndex(new Date());
  return { t, diff, label: diff === 0 ? 'D-Day' : diff > 0 ? `D-${diff.toLocaleString('ko-KR')}` : `D+${(-diff).toLocaleString('ko-KR')}` };
}
function renderDdays() {
  // 다가오는 날(가까운 순) → 지난 날(최근 순)
  const rows = ddayList().filter(x => x && x.date).map(x => ({ x, i: ddayInfo(x) }))
    .sort((a, b) => (a.i.diff < 0) - (b.i.diff < 0) || (a.i.diff >= 0 ? a.i.diff - b.i.diff : b.i.diff - a.i.diff));
  return rows.map(({ x, i }) => `<button class="dday ${i.diff === 0 ? 'today' : i.diff < 0 ? 'past' : ''}" data-dday="${x.id}" title="눌러서 고치기">
      <span class="num">${i.label}</span><span class="name">${esc(x.name)}</span>
      <small>${shortDate(i.t)} ${'일월화수목금토'[i.t.getDay()]}${x.yearly ? ' · 매년' : ''}</small></button>`).join('')
    + `<button class="dday add" data-act="addDday">＋ D-day</button>`;
}
async function ddayDialog(x) {
  const r = await ask({ title: x ? 'D-day 고치기' : '새 D-day', desc: '기다리는 날이나 기념일을 넣어 주세요.', ok: x ? '저장' : '추가', fields: [
    { name: 'name', placeholder: '이름 (예: 결혼기념일)', value: x?.name || '' },
    { name: 'date', type: 'date', label: '날짜', value: x?.date || todayStr() },
    { name: 'yearly', options: [{ value: '0', label: '한 번만 세기' }, { value: '1', label: '매년 반복 (생일, 기념일)' }], value: x?.yearly ? '1' : '0' },
    ...(x ? [{ name: 'action', options: [{ value: 'save', label: '저장' }, { value: 'delete', label: '이 D-day 지우기' }], value: 'save' }] : [])] });
  if (!r) return;
  if (r.action === 'delete') {
    store.data.settings.ddays = ddayList().filter(d => d.id !== x.id);
  } else {
    if (!r.name.trim() || !/^\d{4}-\d{2}-\d{2}$/.test(r.date)) return;
    const v = { name: r.name.trim(), date: r.date, yearly: r.yearly === '1' };
    if (x) Object.assign(x, v); else ddayList().push({ id: uid(), ...v });
  }
  store.save(); render();
}
// 자정이 지나면 숫자를 새로 센다 (앱을 켜 둔 채이거나, 다시 열었을 때)
let shownDay = todayStr();
function refreshDay() { if (todayStr() !== shownDay) { shownDay = todayStr(); if (state.view === 'home' && !$('#dlg').open) render(); } }
setInterval(refreshDay, 60000);

// ---------- 뒤로 가기 (안드로이드 뒤로 버튼, 브라우저 뒤로) ----------
// 홈이 아닐 때 기록을 하나 쌓아 두고, 뒤로 가면 한 단계 위로 올라간다
function rememberDepth() {
  if (state.view !== 'home' && !history.state?.geulbang) { try { history.pushState({ geulbang: 1 }, ''); } catch {} }
}
function goUp() {
  if ($('#dlg').open) { $('#dlg').close('cancel'); return rememberDepth(); }
  if (lightboxOpen()) return rememberDepth();
  $('#app').classList.remove('side-open');
  if (state.view === 'edit') return finishEdit();
  state.view = state.view === 'read' ? 'story' : 'home';
  render();
}
const lightboxOpen = () => { const b = document.querySelector('.lightbox'); if (b) { b.remove(); return true; } return false; };
window.addEventListener('popstate', () => { goUp(); });

// ---------- 사진 ----------
const photosOf = p => Array.isArray(p.photos) ? p.photos : [];
const photoUrl = name => window.geulbang.photoUrl ? window.geulbang.photoUrl(name) : 'photo://local/' + encodeURIComponent(name);
const isWeb = window.geulbang.platform === 'web';

// 첫 번째 사진이 커버. 다른 사진을 누르면 커버로 올라감
function renderPhotoStrip(p) {
  const el = $('#photoStrip'); if (!el) return;
  el.innerHTML = photosOf(p).map((n, i) => `<div class="ph ${i === 0 ? 'cover' : ''}">
      <img src="${photoUrl(n)}" data-cover="${esc(n)}" title="${i === 0 ? '커버 사진' : '눌러서 커버 사진으로'}" alt="">
      <button class="x" data-unphoto="${esc(n)}" title="사진 빼기">×</button></div>`).join('')
    + `<button class="add" id="addPhoto">＋ 사진<br><small>또는 끌어다 놓기</small></button>`;
}
function addPhotos(p, names) {
  if (!names.length) return;
  p.photos = [...photosOf(p), ...names]; p.editedAt = Date.now();
  store.save(); renderPhotoStrip(p);
}
function openLightbox(name) {
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = `<img src="${photoUrl(name)}" alt="">`;

// ---------- 동기화 ----------
let syncState = null;
function renderSyncLine(s = syncState) {
  syncState = s;
  const el = $('#syncLine'); if (!el || !s) return;
  if (!s.enabled) { el.textContent = ''; return; }
  const t = s.lastSyncAt ? new Date(s.lastSyncAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
  el.textContent = s.error ? `iCloud 동기화 오류: ${s.error}`
    : s.running ? 'iCloud 동기화 중…'
    : `iCloud 동기화됨${t ? ' · ' + t : ''}${s.pending ? ` · ${s.pending}개 내려받는 중` : ''}`;
}
let reloadPending = false;
async function reloadFromDisk() {
  if (state.view === 'edit') { reloadPending = true; return; }
  reloadPending = false;
  if (store.timer) await store.flush();
  const data = await window.geulbang.load();
  if (!data) return;
  store.data = { ...data, settings: { ...seed().settings, ...data.settings } };
  if (!story(state.storyId) || story(state.storyId).trashedAt) state.storyId = liveStories()[0]?.id || null;
  if (state.postId && !post(state.postId)) state.view = 'story';
  applyTheme(); render();
}

// 단어수 / 글자수(공백 포함) / 글자수(공백 제외) — 누를 때마다 전환
function updateCounter(text) {
  const el = $('#counter'); if (!el) return;
  const mode = store.data.settings.countMode;
  const words = (text.trim().match(/\S+/g) || []).length;
  const label = [`단어 ${words}`, `글자 ${text.length} (공백 포함)`, `글자 ${text.replace(/\s/g, '').length} (공백 제외)`][mode];
  el.textContent = label;
  el.onclick = () => { store.data.settings.countMode = (mode + 1) % 3; store.save(); updateCounter(text); };
}

function renderSearch(m) {
  const q = state.query.trim().toLowerCase();
  const hits = q ? store.data.posts.filter(p => !p.trashedAt && story(p.storyId) && !story(p.storyId).trashedAt &&
    (p.title.toLowerCase().includes(q) || p.text.toLowerCase().includes(q))).sort((a, b) => b.writedAt - a.writedAt) : [];
  const hl = s => { const e = esc(s); if (!q) return e; return e.replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), x => `<mark>${x}</mark>`); };
  const snippet = t => { const i = t.toLowerCase().indexOf(q); return i < 0 ? t.slice(0, 140) : (i > 40 ? '…' : '') + t.slice(Math.max(0, i - 40), i + 100); };
  m.innerHTML = `
    <div class="toolbar"><button class="tool" id="back">← 돌아가기</button><span class="spacer"></span></div>
    <div class="wrap">
      <input class="search" id="q" placeholder="모든 이야기에서 검색" value="${esc(state.query)}">
      ${hits.map(p => `<button class="post-card" data-open="${p.id}">
        <time>${esc(story(p.storyId).title)} · ${fmtDate(p.writedAt)}</time>
        <h3>${hl(p.title || '제목 없음')}</h3><p>${hl(snippet(p.text))}</p></button>`).join('')
        || (q ? `<div class="empty">검색 결과가 없어요.</div>` : '')}
    </div>`;
  const input = $('#q'); input.focus(); input.setSelectionRange(input.value.length, input.value.length);
  input.addEventListener('input', () => { state.query = input.value; renderSearch(m); });
}

function renderTrash(m) {
  const tp = store.data.posts.filter(p => p.trashedAt).sort((a, b) => b.trashedAt - a.trashedAt);
  const ts = store.data.stories.filter(s => s.trashedAt);
  const left = t => Math.max(0, 30 - Math.floor((Date.now() - t) / DAY));
  m.innerHTML = `
    <div class="toolbar"><button class="tool" id="back">← 돌아가기</button><span class="spacer"></span>
      <button class="tool" id="emptyTrash">휴지통 비우기</button></div>
    <div class="wrap">
      <div class="story-head"><h1>휴지통</h1><p>삭제한 글과 이야기는 30일간 보관된 뒤 영구 삭제됩니다.</p></div>
      ${ts.map(s => `<div class="post-card"><time>이야기 · ${left(s.trashedAt)}일 남음</time><h3>${esc(s.title)}</h3>
        <button class="tool" data-restore-story="${s.id}">복원</button></div>`).join('')}
      ${tp.map(p => `<div class="post-card"><time>${esc(story(p.storyId)?.title || '')} · ${left(p.trashedAt)}일 남음</time>
        <h3>${esc(p.title || '제목 없음')}</h3><p>${esc(p.text.slice(0, 120))}</p>
        <button class="tool" data-restore-post="${p.id}">복원</button> <button class="tool" data-purge-post="${p.id}">영구 삭제</button></div>`).join('')}
      ${!tp.length && !ts.length ? `<div class="empty">휴지통이 비어 있어요.</div>` : ''}
    </div>`;

// ---------- 다이얼로그 ----------
function ask({ title, desc = '', fields = [], ok = '확인', danger }) {
  const dlg = $('#dlg'), form = $('#dlgForm');
  form.innerHTML = `<h4>${title}</h4><p class="desc">${desc}</p>
    ${fields.map(f => f.options
      ? `<select name="${f.name}">${f.options.map(o => `<option value="${o.value}" ${o.value === f.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`
      : `${f.label ? `<label class="field" for="dlg-${f.name}">${esc(f.label)}</label>` : ''}<input id="dlg-${f.name}" name="${f.name}" type="${f.type || 'text'}" placeholder="${f.placeholder || ''}" value="${esc(f.value || '')}">`).join('')}
    <div class="row"><button value="cancel" formnovalidate>취소</button><button value="ok" class="primary" ${danger ? 'style="background:#c0392b"' : ''}>${ok}</button></div>`;
  dlg.showModal();
  return new Promise(res => dlg.addEventListener('close', () => {
    if (dlg.returnValue !== 'ok') return res(null);
    res(Object.fromEntries(new FormData(form)));
  }, { once: true }));
}

// ---------- 동작 ----------
function newPost() {
  const now = Date.now();
  const p = { id: uid(), storyId: state.storyId, title: '', text: '', writedAt: now, editedAt: now, trashedAt: null, align: 'left', photos: [] };
  store.data.posts.push(p); store.save();
  Object.assign(state, { view: 'edit', postId: p.id }); render();
}
function finishEdit() {
  const p = post(state.postId);
  if (p && !p.title.trim() && !p.text.trim() && !photosOf(p).length) { store.data.posts = store.data.posts.filter(x => x !== p); store.save(); state.view = 'story'; }
  else state.view = 'read';
  render();
  if (reloadPending) reloadFromDisk();
}
async function addStory() {
  const folders = [{ value: '', label: '폴더 없음' }, ...store.data.folders.map(f => ({ value: f.id, label: f.title }))];
  const r = await ask({ title: '새 이야기', desc: '이야기의 제목과 소제목을 입력해주세요.\n다짐말을 써도 좋아요.',
    fields: [{ name: 'title', placeholder: '제목' }, { name: 'subtitle', placeholder: '소제목' }, { name: 'folderId', options: folders, value: '' }], ok: '추가' });
  if (!r || !r.title.trim()) return;
  const s = { id: uid(), folderId: r.folderId || null, title: r.title.trim(), subtitle: r.subtitle.trim(), createdAt: Date.now(),
    trashedAt: null, orderBy: 'writedAt', orderDir: 'desc', rank: store.data.stories.length, dateVisible: true };
  store.data.stories.push(s); store.save();
  Object.assign(state, { view: 'story', storyId: s.id }); render();
}
async function editStory() {
  const s = story(state.storyId);
  const folders = [{ value: '', label: '폴더 없음' }, ...store.data.folders.map(f => ({ value: f.id, label: f.title }))];
  const r = await ask({ title: '이 이야기', fields: [
    { name: 'title', value: s.title, placeholder: '제목' }, { name: 'subtitle', value: s.subtitle, placeholder: '소제목' },
    { name: 'folderId', options: folders, value: s.folderId || '' },
    { name: 'dateVisible', options: [{ value: '1', label: '글 날짜 표시' }, { value: '0', label: '글 날짜 숨기기' }], value: s.dateVisible ? '1' : '0' },
    { name: 'action', options: [{ value: 'save', label: '저장' }, { value: 'trash', label: '이 이야기를 휴지통으로' }], value: 'save' }] });
  if (!r) return;
  if (r.action === 'trash') { s.trashedAt = Date.now(); state.storyId = liveStories()[0]?.id || null; state.view = 'home'; }
  else Object.assign(s, { title: r.title.trim() || s.title, subtitle: r.subtitle.trim(), folderId: r.folderId || null, dateVisible: r.dateVisible === '1' });
  store.save(); render();
}
async function addFolder() {
  const r = await ask({ title: '새 폴더', fields: [{ name: 'title', placeholder: '폴더 이름' }], ok: '추가' });
  if (!r || !r.title.trim()) return;
  store.data.folders.push({ id: uid(), title: r.title.trim(), createdAt: Date.now(), rank: store.data.folders.length });
  store.save(); render();
}
async function settings() {
  const st = store.data.settings;
  const sy = await window.geulbang.syncStatus();
  const syncDesc = isWeb ? '글과 사진은 이 기기의 브라우저 안에만 저장돼요.\n다른 기기로 옮기거나 잃어버리지 않으려면 이야기 목록(☰) 아래의 "백업 내보내기"로 자주 받아 두세요.'
    : !sy.available ? 'iCloud Drive를 찾을 수 없어 동기화를 쓸 수 없어요.\n시스템 설정 › Apple 계정 › iCloud에서 iCloud Drive를 켜 주세요.'
    : `동기화 폴더: iCloud Drive/글방\n같은 Apple 계정의 다른 Mac에서도 글방을 켜면 글과 사진이 합쳐집니다.`;
  const r = await ask({ title: '설정', desc: syncDesc, fields: [
    ...(sy.available ? [{ name: 'sync', options: [{ value: '1', label: 'iCloud 동기화 켜기' }, { value: '0', label: 'iCloud 동기화 끄기' }], value: sy.enabled ? '1' : '0' }] : []),
    { name: 'theme', options: [{ value: 'light', label: '밝은 테마' }, { value: 'dark', label: '어두운 테마' }], value: st.theme },
    { name: 'fontSize', options: [15, 16, 17, 18, 20, 22].map(n => ({ value: String(n), label: `글자 크기 ${n}px` })), value: String(st.fontSize) },
    // 웹에서는 파일 선택 창을 버튼을 누른 순간에만 열 수 있어 목록 아래 버튼으로만 백업한다
    ...(isWeb ? [] : [{ name: 'data', options: [{ value: '', label: '데이터 작업 없음' }, { value: 'backup', label: '전체 백업 (JSON 다운로드)' }, { value: 'restore', label: '백업에서 복원' }], value: '' }])], ok: '적용' });
  if (!r) return;
  st.theme = r.theme; st.fontSize = +r.fontSize; applyTheme(); store.save();
  if (r.sync !== undefined && (r.sync === '1') !== sy.enabled) {
    await store.flush();
    renderSyncLine(await window.geulbang.setSyncEnabled(r.sync === '1'));
  }
  render();
  if (r.data === 'backup') backup();
  if (r.data === 'restore') restore();
}
function exportStory() {
  const s = story(state.storyId); if (!s) return;
  const body = postsOf(s).map(p => `## ${p.title || '제목 없음'}\n_${fmtDate(p.writedAt)}_\n\n${p.text}`).join('\n\n---\n\n');
  window.geulbang.saveFile(`${s.title}.md`, `# ${s.title}\n\n> ${s.subtitle}\n\n${body}\n`);
}
// 백업 파일은 아이폰 글방과 같은 형식 (사진 포함)
async function backup() {
  await store.flush();
  try { await window.geulbang.exportBackup(store.data); }
  catch (err) { alert('백업을 만들 수 없습니다: ' + err.message); }
}
async function restore() {
  try {
    const data = await window.geulbang.openBackup(); if (!data) return;
    const n = data.stories.filter(s => !s.trashedAt).length, m = data.posts.filter(p => !p.trashedAt).length;
    if (!await ask({ title: '백업에서 복원', ok: '복원', danger: true,
      desc: `이야기 ${n}개, 글 ${m}개, 사진 ${data.photos}장이 들어 있어요.\n지금 있는 모든 글이 백업 내용으로 바뀝니다.` })) return;
    // 테마는 이 Mac의 설정을 유지
    store.data = { folders: data.folders, stories: data.stories, posts: data.posts,
      settings: { ...seed().settings, ...data.settings, theme: store.data.settings.theme } };
    await store.flush();
    state.storyId = liveStories()[0]?.id || null; state.view = 'story'; applyTheme(); render();
  } catch (err) {
    // Mac은 오류 앞에 IPC 설명이 붙어 오므로 문구로 구분한다
    if (String(err.message).includes('글방 백업 파일이 아니에요')) {
      alert('고른 파일은 글방 백업 파일이 아니에요.\n\n글방의 "백업 내보내기"(Mac은 파일 › "전체 백업…")로 만든 geulbang-backup-….json 파일을 골라 주세요.');
    } else alert('백업 파일을 읽을 수 없습니다: ' + err.message);
  }
}
function exportPDF() {
  const p = state.view === 'read' && post(state.postId), s = story(state.storyId);
  const name = (p ? p.title || '제목 없음' : s ? s.title : '글방') + '.pdf';
  window.geulbang.exportPDF(name);
}
function applyTheme() { document.documentElement.dataset.theme = store.data.settings.theme; }
let savedTimer;
function flashSaved() { const el = $('#saved'); el.textContent = '저장됨'; clearTimeout(savedTimer); savedTimer = setTimeout(() => el.textContent = '', 1200); }

// ---------- 이벤트 위임 ----------
document.addEventListener('click', async e => {
  const img = e.target.closest('img[data-zoom], img[data-cover]');
  if (img?.dataset.zoom) return openLightbox(img.dataset.zoom);
  if (img?.dataset.cover) {
    const p = post(state.postId), n = img.dataset.cover;
    p.photos = [n, ...photosOf(p).filter(x => x !== n)]; store.save(); return renderPhotoStrip(p);
  }
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset, s = story(state.storyId);
  if (t.id === 'addPhoto') { const p = post(state.postId); return addPhotos(p, await window.geulbang.pickPhotos()); }
  if (d.unphoto) { const p = post(state.postId); p.photos = photosOf(p).filter(x => x !== d.unphoto); store.save(); return renderPhotoStrip(p); }
  if (d.story) { Object.assign(state, { view: 'story', storyId: d.story }); $('#app').classList.remove('side-open'); m0(); return render(); }
  if (d.dday) { const x = ddayList().find(v => v.id === d.dday); return x && ddayDialog(x); }
  if (d.act) {
    switch (d.act) {
      case 'addDday': return ddayDialog(null);
      case 'addStory': return addStory();
      case 'addFolder': return addFolder();
      case 'trash': state.view = 'trash'; m0(); return render();
      case 'settings': return settings();
      case 'backup': return backup();
      case 'restore': return restore();
    }
  }
  if (d.post) { Object.assign(state, { view: 'read', postId: d.post }); return render(); }
  if (d.open) { const p = post(d.open); Object.assign(state, { view: 'read', postId: p.id, storyId: p.storyId }); return render(); }
  if (d.delfolder) {
    if (!await ask({ title: '폴더 삭제', desc: '폴더를 삭제하시겠습니까? 폴더 안의 이야기는 유지됩니다.', ok: '삭제', danger: true })) return;
    store.data.stories.forEach(x => { if (x.folderId === d.delfolder) x.folderId = null; });
    store.data.folders = store.data.folders.filter(f => f.id !== d.delfolder); store.save(); return render();
  }
  if (d.restorePost) { const p = post(d.restorePost); p.trashedAt = null; if (story(p.storyId)) story(p.storyId).trashedAt = null; store.save(); return render(); }
  if (d.restoreStory) { story(d.restoreStory).trashedAt = null; store.save(); return render(); }
  if (d.purgePost) { store.data.posts = store.data.posts.filter(p => p.id !== d.purgePost); store.save(); return render(); }
  switch (t.id) {
    case 'btnAddStory': return addStory();
    case 'btnAddFolder': return addFolder();
    case 'btnTrash': state.view = 'trash'; $('#app').classList.remove('side-open'); m0(); return render();
    case 'goHome': case 'homeBtn': state.view = 'home'; $('#app').classList.remove('side-open'); m0(); return render();
    case 'btnSettings': $('#app').classList.remove('side-open'); return settings();
    case 'btnBackup': $('#app').classList.remove('side-open'); return backup();
    case 'btnRestore': $('#app').classList.remove('side-open'); return restore();
    case 'menuBtn': return $('#app').classList.toggle('side-open');
    case 'newPost': return newPost();
    case 'tSearch': state.view = 'search'; return render();
    case 'tSort': {
      // 날짜↓ → 날짜↑ → 제목↑ → 제목↓
      const seq = [['writedAt', 'desc'], ['writedAt', 'asc'], ['title', 'asc'], ['title', 'desc']];
      const i = seq.findIndex(([b, dir]) => b === s.orderBy && dir === s.orderDir);
      [s.orderBy, s.orderDir] = seq[(i + 1) % seq.length]; store.save(); return render();
    }
    case 'tStoryEdit': return editStory();
    case 'tExport': return exportStory();
    // 글 읽기에서는 이야기로, 검색·휴지통에서는 홈으로
    case 'back': state.view = state.view === 'read' ? 'story' : 'home'; m0(); return render();
    case 'tEdit': state.view = 'edit'; return render();
    case 'done': return finishEdit();
    case 'tPrint': return exportPDF();
    case 'tDelete': {
      if (!await ask({ title: '이 글 삭제하기', desc: '삭제한 글은 휴지통에 30일간 보관됩니다.', ok: '삭제', danger: true })) return;
      post(state.postId).trashedAt = Date.now(); store.save(); state.view = 'story'; return render();
    }
    case 'tAlign': {
      const p = post(state.postId), order = ['left', 'center', 'justify'];
      p.align = order[(order.indexOf(p.align) + 1) % 3]; store.save(); return render();
    }
    case 'emptyTrash': {
      if (!await ask({ title: '휴지통 비우기', desc: '휴지통의 모든 항목을 영구 삭제합니다. 되돌릴 수 없어요.', ok: '비우기', danger: true })) return;
      const dead = new Set(store.data.stories.filter(x => x.trashedAt).map(x => x.id));
      store.data.posts = store.data.posts.filter(p => !p.trashedAt && !dead.has(p.storyId));
      store.data.stories = store.data.stories.filter(x => !x.trashedAt); store.save(); return render();
    }
  }
});
document.addEventListener('dblclick', e => { if (state.view === 'read' && e.target.closest('#reader')) { state.view = 'edit'; render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#dlg').open) {
    if (state.view === 'edit') finishEdit();
    else if (state.view !== 'home') { state.view = state.view === 'read' ? 'story' : 'home'; m0(); render(); }
  }
});

// 앱 메뉴(단축키 포함)는 메인 프로세스에서 보내옴
window.geulbang.onMenu(cmd => {
  if ($('#dlg').open) return;
  switch (cmd) {
    case 'newPost': if (state.storyId) { if (state.view === 'edit') finishEdit(); newPost(); } return;
    case 'newStory': return addStory();
    case 'export': return exportStory();
    case 'pdf': return exportPDF();
    case 'backup': return backup();
    case 'restore': return restore();
    case 'search': state.view = 'search'; return render();
    case 'trash': state.view = 'trash'; return render();
    case 'settings': return settings();
  }
});
// 창을 닫거나(맥) 앱을 내리기(아이폰) 직전 남은 저장 반영
function saveNow() {
  if (state.view === 'edit') {
    const p = post(state.postId), ta = $('#eText');
    if (p && ta) { p.title = $('#eTitle').value; p.text = ta.value; }
  }
  clearTimeout(store.timer);
  window.geulbang.saveSync(store.data);
}
window.addEventListener('beforeunload', saveNow);
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); else refreshDay(); });
// 화면을 옮길 때 맨 위부터 보이게
function m0() { $('#main').scrollTop = 0; }
// 모바일에서 열린 목록 바깥을 누르면 닫기
$('#main').addEventListener('click', e => {
  if ($('#app').classList.contains('side-open') && !e.target.closest('#menuBtn')) $('#app').classList.remove('side-open');
}, true);

window.geulbang.onChanged(() => reloadFromDisk());
window.geulbang.onSyncStatus(s => renderSyncLine(s));

(async () => {
  await store.load();
  applyTheme();
  state.storyId = liveStories()[0]?.id || null;
  state.view = 'home';
  render();
  renderSyncLine(await window.geulbang.syncStatus());
})();
</script>
</body>
</html>
